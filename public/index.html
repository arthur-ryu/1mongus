<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>원몽어스</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Fredoka One', cursive, sans-serif; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #e2e8f0; color: #1e293b; }

#rotate-device-screen { display: none; position: fixed; inset: 0; background: #f8fafc; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; }
#rotate-device-screen svg { width: 72px; height: 72px; margin-bottom: 20px; fill: #0284c7; animation: rotateAnim 2s infinite ease-in-out; }
#rotate-device-screen h2 { font-size: 24px; color: #0f172a; }
@keyframes rotateAnim { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
@media screen and (orientation: portrait) { #rotate-device-screen { display: flex !important; } }

.screen { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; z-index: 10; }
.active { display: flex !important; }
.card { background: #fff; border: 4px solid #94a3b8; border-radius: 24px; padding: clamp(20px, 4vw, 36px); width: clamp(300px, 80vw, 520px); box-shadow: 0 16px 40px rgba(100,116,139,.25); display: flex; flex-direction: column; align-items: center; gap: 14px; }
h1.brand-title { font-size: clamp(44px, 8vw, 68px); color: #ef4444; -webkit-text-stroke: 2px #0f172a; text-shadow: 3px 3px 0 rgba(0,0,0,.15); }
input, select, button { width: 100%; padding: 12px 16px; border-radius: 12px; border: 3px solid #cbd5e1; background: #f8fafc; color: #0f172a; font-size: 16px; outline: none; }
input:focus, select:focus { border-color: #0284c7; background: #fff; }
input:disabled { opacity: .5; }
.btn-main { background: #ef4444; border: 3px solid #0f172a; font-size: 20px; cursor: pointer; color: #fff; box-shadow: 0 5px 0 #991b1b; transition: transform .1s, box-shadow .1s; }
.btn-main:active { transform: translateY(3px); box-shadow: 0 2px 0 #991b1b; }
.room-list-box { width: 100%; max-height: 180px; overflow-y: auto; border: 3px solid #cbd5e1; border-radius: 12px; background: #f1f5f9; }
.room-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 2px solid #e2e8f0; }
.room-item button { width: auto; padding: 6px 14px; font-size: 14px; background: #0284c7; color: #fff; border: 2px solid #0f172a; cursor: pointer; }

#canvas-container { position: absolute; inset: 0; background: #000; }
canvas { display: block; width: 100%; height: 100%; }

.top-right-hud { position: absolute; top: 16px; right: 16px; display: none; gap: 12px; z-index: 60; pointer-events: auto; }
.hud-circle-btn { width: 58px; height: 58px; cursor: pointer; border-radius: 50%; background: #fff; border: 3px solid #64748b; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.18); transition: transform .1s; font-size: 26px; }
.hud-circle-btn:active { transform: scale(.92); }
.hud-map-btn { background-image: url('https://cdn.jsdelivr.net/gh/arthur-ryu/1mongus-cdn@main/map.png'); background-size: contain; background-repeat: no-repeat; background-position: center; }

.action-btn-group { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; z-index: 60; align-items: flex-end; }
.action-btn-row { display: flex; gap: 14px; justify-content: flex-end; }
.among-img-btn { width: 82px; height: 82px; cursor: pointer; background-size: contain; background-repeat: no-repeat; background-position: center; transition: all .1s; opacity: .35; pointer-events: none; position: relative; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
.among-img-btn.active { opacity: 1 !important; pointer-events: auto !important; }
.among-img-btn:active { transform: translateY(4px) scale(.95); }
.btn-use { background-image: url('https://cdn.jsdelivr.net/gh/arthur-ryu/1mongus-cdn@main/use.png'); }
.btn-sabotage { background-image: url('https://cdn.jsdelivr.net/gh/arthur-ryu/1mongus-cdn@main/sabotage.png'); display: none; }
.btn-kill { background-image: url('https://cdn.jsdelivr.net/gh/arthur-ryu/1mongus-cdn@main/kill.png'); display: none; }
.btn-vent { background-image: url('https://cdn.jsdelivr.net/gh/arthur-ryu/1mongus-cdn@main/vent.png'); display: none; }
.btn-report { background-image: url('https://cdn.jsdelivr.net/gh/arthur-ryu/1mongus-cdn@main/report.png'); }
.cooldown-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.65); border-radius: 50%; display: none; justify-content: center; align-items: center; font-size: 26px; color: #fff; font-weight: 900; -webkit-text-stroke: 1.5px #000; pointer-events: none; }

#sab-banner { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: none; padding: 8px 22px; background: #ef4444; color: #fff; border: 3px solid #0f172a; border-radius: 20px; font-size: 18px; z-index: 62; pointer-events: none; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .6; } }

#vent-nav-ui { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 65; }
.vent-arrow-btn { position: absolute; width: 68px; height: 68px; display: flex; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; transform-origin: center center; }
.vent-arrow-btn svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px #38fedc) drop-shadow(0 4px 8px rgba(0,0,0,.8)); }
.vent-arrow-btn:active svg { transform: scale(.92); }

#start-btn-in-room { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: auto; padding: 16px 56px; font-size: 24px; letter-spacing: 2px; pointer-events: auto; display: none; z-index: 70; background: #ef4444; border: 4px solid #0f172a; border-radius: 40px; box-shadow: 0 6px 0 #991b1b; }
#start-btn-in-room:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #991b1b; }

#joystick-zone { position: absolute; bottom: 24px; left: 24px; width: 120px; height: 120px; background: rgba(255,255,255,.3); border: 3px solid rgba(15,23,42,.2); border-radius: 50%; pointer-events: auto; touch-action: none; z-index: 60; }
#joystick-knob { position: absolute; top: 32px; left: 32px; width: 56px; height: 56px; background: radial-gradient(circle at 35% 35%, #0284c7, #0369a1); border: 3px solid #0f172a; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,.3); }

#map-modal, #admin-modal, #cam-modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.7); z-index: 400; justify-content: center; align-items: center; pointer-events: auto; }
.map-box { width: min(880px, 92vw); aspect-ratio: 16/9; background: #fff; border: 4px solid #64748b; border-radius: 20px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,.3); }
.map-close-btn { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; background: #ef4444; color: #fff; border: 3px solid #0f172a; font-size: 18px; cursor: pointer; z-index: 10; }

#sabotage-modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.7); z-index: 420; justify-content: center; align-items: center; pointer-events: auto; }
.sabotage-box { width: min(880px, 92vw); aspect-ratio: 16/9; background: #0f172a url('https://cdn.jsdelivr.net/gh/arthur-ryu/1mongus-cdn@main/The_Skeld_map.png') center/100% 100% no-repeat; border: 4px solid #ef4444; border-radius: 20px; position: relative; box-shadow: 0 0 40px rgba(239,68,68,.3); }
.sab-icon { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: #ef4444; border: 3px solid #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.4); font-size: 20px; }
.sab-icon.door { background: #f59e0b; }
.sab-icon.off { opacity: .35; pointer-events: none; filter: grayscale(.8); }

#meeting-intro-screen { position: fixed; inset: 0; z-index: 900; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(15,23,42,.93); text-align: center; gap: 14px; }
#mi-title { font-size: clamp(36px, 7vw, 70px); color: #ef4444; -webkit-text-stroke: 2px #000; }
#mi-sub { font-size: clamp(18px, 3vw, 28px); color: #fff; }

#meeting-modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.65); z-index: 500; justify-content: center; align-items: center; padding: 16px; pointer-events: auto; }
.meeting-box { background: #f8fafc; border: 6px solid #64748b; border-radius: 24px; width: min(920px, 94vw); height: min(600px, 92vh); display: flex; flex-direction: column; padding: 22px; gap: 16px; box-shadow: 0 20px 50px rgba(15,23,42,.35); position: relative; }
.meeting-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #e2e8f0; padding-bottom: 12px; }
.meeting-title { color: #ef4444; font-size: 26px; -webkit-text-stroke: 1.5px #0f172a; }
.meeting-chat-btn { width: 48px; height: 48px; border-radius: 50%; background: #0284c7; color: #fff; border: 3px solid #0f172a; font-size: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 8px rgba(0,0,0,.15); transition: transform .1s; }
.meeting-chat-btn:active { transform: scale(.92); }
.voter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; overflow-y: auto; flex: 1; padding: 4px; }
.voter-card { background: #fff; border: 3px solid #cbd5e1; border-radius: 14px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; min-height: 54px; box-shadow: 0 4px 8px rgba(0,0,0,.04); transition: border-color .1s, transform .1s; }
.voter-card:hover { border-color: #0284c7; transform: translateY(-2px); }
.voter-card.dead { opacity: .45; filter: grayscale(1); pointer-events: none; background: #f1f5f9; }
.voter-card.locked { pointer-events: none !important; }
.voted-badge { background: #22c55e; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 20px; border: 1.5px solid #0f172a; font-weight: bold; margin-left: 6px; }
.voted-by-container { display: flex; gap: 4px; align-items: center; }
.vote-mini-marker { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #000; font-size: 10px; display: flex; align-items: center; justify-content: center; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.meeting-footer { display: flex; justify-content: space-between; align-items: center; border-top: 3px solid #e2e8f0; padding-top: 10px; }
.skip-btn { width: auto; padding: 10px 24px; background: #e2e8f0; color: #0f172a; border: 3px solid #64748b; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; }
.skip-btn.locked { opacity: .5; pointer-events: none; }
.meeting-timer-box { font-size: 18px; font-weight: bold; color: #ef4444; background: #fee2e2; padding: 6px 16px; border-radius: 20px; border: 2px solid #ef4444; }

#chat-modal { display: none; position: absolute; inset: 16px; background: #fff; border: 4px solid #64748b; border-radius: 20px; z-index: 550; flex-direction: column; padding: 16px; gap: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 6px 4px; }
.chat-row { display: flex; flex-direction: column; width: 100%; }
.chat-row.mine { align-items: flex-end; }
.chat-row.other { align-items: flex-start; }
.chat-sender-info { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 3px; }
.chat-bubble { max-width: 75%; padding: 8px 14px; border-radius: 16px; font-size: 14px; word-break: break-all; white-space: pre-wrap; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,.06); }
.chat-bubble.mine { background: #0284c7; color: #fff; border-bottom-right-radius: 4px; }
.chat-bubble.other { background: #f1f5f9; color: #0f172a; border: 1.5px solid #cbd5e1; border-bottom-left-radius: 4px; }
.chat-voted-tag { background: #22c55e; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: bold; border: 1px solid #0f172a; }
.chat-input-bar { display: flex; gap: 8px; }
.chat-input-bar input { flex: 1; }
.chat-input-bar button { width: auto; padding: 10px 22px; background: #0284c7; color: #fff; border: 2px solid #0f172a; cursor: pointer; }

#role-reveal-screen, #ejection-screen { position: fixed; inset: 0; z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; background: #000; text-align: center; }
#role-title { font-size: clamp(54px, 10vw, 92px); -webkit-text-stroke: 3px #000; }
#sab-flash { position: fixed; inset: 0; pointer-events: none; z-index: 45; display: none; background: radial-gradient(ellipse at center, rgba(239,68,68,0) 35%, rgba(239,68,68,.6) 100%); animation: redflash 1.2s ease-in-out infinite; }
@keyframes redflash { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
#gameover-screen { position: fixed; inset: 0; z-index: 3000; display: none; flex-direction: column; justify-content: center; align-items: center; background: #000; gap: 14px; text-align: center; }
#go-title { font-size: clamp(60px, 12vw, 120px); -webkit-text-stroke: 3px #000; }
#go-sub { color: #cbd5e1; font-size: 22px; }
</style>
</head>
<body>

<div id="rotate-device-screen">
  <svg viewBox="0 0 24 24"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zM7.52 21.48C4.25 19.94 1.91 16.76 1.55 13H.05C.56 19.16 5.71 24 12 24l.66-.03-3.81-3.81-1.33 1.32zM6 6v12h12V6H6zm10 10H8V8h8v8z"/></svg>
  <h2>화면을 가로로 돌려주세요</h2>
</div>

<div id="role-reveal-screen">
  <div id="role-title">CREWMATE</div>
  <div id="role-subtitle" style="font-size:22px; color:#aaa; margin-top:8px;">크루원들 사이에 임포스터가 숨어있습니다.</div>
</div>

<div id="ejection-screen">
  <div id="ejection-text" style="font-size:32px; color:#fff; text-shadow:2px 2px #000;">누군가 우주 밖으로 방출되었습니다.</div>
</div>

<div id="meeting-intro-screen"><div id="mi-title"></div><div id="mi-sub"></div></div>

<div id="screen-auth" class="screen active">
  <div class="card">
    <h1 class="brand-title">1mongus</h1>
    <p style="font-size:14px; color:#64748b;">비밀번호를 입력하세요.</p>
    <input type="password" id="auth-code-input" placeholder="비밀번호 입력">
    <button class="btn-main" onclick="handleAuth()">인증하기</button>
    <div id="auth-error" style="color:#ef4444; font-size:14px; display:none;">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<div id="screen-home" class="screen">
  <div class="card">
    <input type="text" id="player-nickname-input" placeholder="닉네임 입력 (2~5자)" maxlength="5" style="text-align:center; font-size:18px; font-weight:bold; letter-spacing:1px;">
    <h1 class="brand-title">1mongus</h1>
    <button class="btn-main" style="padding: 16px 24px;" onclick="goToLobbyList()">시작하기</button>
    <div id="nickname-error" style="color:#ef4444; font-size:14px; display:none;">닉네임은 2글자 이상 5글자 이하로 입력해주세요.</div>
  </div>
</div>

<div id="screen-rooms" class="screen">
  <div class="card" style="width: clamp(300px, 85vw, 600px);">
    <h2 style="font-size:24px; align-self: flex-start; color:#0f172a;">우주선 방 목록</h2>
    <div class="room-list-box" id="room-list-container"></div>
    <div style="width:100%; height:2px; background:#e2e8f0; margin: 4px 0;"></div>
    <h3 style="font-size:18px; align-self: flex-start; color:#0f172a;">새로운 방 만들기</h3>
    <div style="display:flex; gap:10px; width:100%;">
      <input type="text" id="create-room-name" placeholder="방 이름 입력" style="flex:2;">
      <select id="create-room-max" style="flex:1;">
        <option value="5">5명</option>
        <option value="6">6명</option>
        <option value="7">7명 (임포 2명)</option>
        <option value="10" selected>10명</option>
      </select>
    </div>
    <button class="btn-main" onclick="handleCreateRoom()">방 만들기</button>
  </div>
</div>

<div id="canvas-container"><canvas id="game-canvas"></canvas></div>

<div class="top-right-hud" id="top-right-hud">
  <div class="hud-circle-btn hud-map-btn" onclick="toggleMapModal()"></div>
</div>

<div id="in-game-ui">
  <div id="room-info-pill" style="position:absolute; top:16px; left:16px; padding:8px 18px; background:rgba(255,255,255,.85); border:3px solid #64748b; border-radius:20px; font-size:14px; font-weight:bold; color:#0f172a;">대기실 | 1/10</div>
  <div id="sab-banner"></div>
  <button id="start-btn-in-room" class="btn-main" onclick="handleStartGame()">START</button>

  <div class="action-btn-group">
    <div class="action-btn-row">
      <div id="btn-vent" class="among-img-btn btn-vent" onclick="triggerVent()"></div>
      <div id="btn-report" class="among-img-btn btn-report" onclick="triggerReport()"></div>
    </div>
    <div class="action-btn-row">
      <div id="btn-kill" class="among-img-btn btn-kill" onclick="triggerKill()"><div id="kill-cooldown-num" class="cooldown-overlay"></div></div>
      <div id="btn-sabotage" class="among-img-btn btn-sabotage" onclick="triggerSabotageOrUse()"><div id="sab-cooldown-num" class="cooldown-overlay"></div></div>
      <div id="btn-use" class="among-img-btn btn-use" onclick="triggerUse()" style="display:none;"></div>
    </div>
  </div>

  <div id="vent-nav-ui"></div>
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
</div>

<div id="map-modal">
  <div class="map-box">
    <button class="map-close-btn" onclick="toggleMapModal()">✕</button>
    <canvas id="minimap-canvas" style="width:100%; height:100%; border-radius:16px;"></canvas>
  </div>
</div>

<div id="sab-flash"></div>
<div id="gameover-screen">
  <div id="go-title"></div>
  <canvas id="go-canvas" width="800" height="260" style="width:min(800px,92vw);height:auto;"></canvas>
  <div id="go-sub"></div>
  <button class="btn-main" style="width:auto;padding:14px 40px;" onclick="location.reload()">나가기</button>
</div>

<div id="cam-modal">
  <div class="map-box" style="background:#000;">
    <button class="map-close-btn" onclick="closeCams()">✕</button>
    <div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:8px;width:100%;height:100%;">
      <canvas class="cam-c" width="440" height="248" style="width:100%;height:100%;border-radius:8px;"></canvas>
      <canvas class="cam-c" width="440" height="248" style="width:100%;height:100%;border-radius:8px;"></canvas>
      <canvas class="cam-c" width="440" height="248" style="width:100%;height:100%;border-radius:8px;"></canvas>
      <canvas class="cam-c" width="440" height="248" style="width:100%;height:100%;border-radius:8px;"></canvas>
    </div>
  </div>
</div>

<div id="admin-modal">
  <div class="map-box">
    <button class="map-close-btn" onclick="closeAdminMap()">✕</button>
    <canvas id="admin-canvas" style="width:100%; height:100%; border-radius:16px;"></canvas>
  </div>
</div>

<div id="sabotage-modal">
  <div class="sabotage-box" id="sabotage-box">
    <button class="map-close-btn" onclick="closeSabotageModal()">✕</button>
  </div>
</div>

<div id="meeting-modal">
  <div class="meeting-box">
    <div class="meeting-header">
      <h2 class="meeting-title">🚨 EMERGENCY MEETING</h2>
      <button class="meeting-chat-btn" onclick="toggleChatModal()">💬</button>
    </div>
    <div class="voter-grid" id="voter-list"></div>
    <div class="meeting-footer">
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="skip-vote-btn" class="skip-btn" onclick="castVote('SKIP')">투표 건너뛰기 (SKIP)</button>
        <div id="skip-voters-box" class="voted-by-container"></div>
      </div>
      <div id="meeting-timer-box" class="meeting-timer-box">토론 시간: 10s</div>
    </div>
    <div id="chat-modal">
      <div class="chat-header">
        <h3 style="font-size:18px; color:#0f172a;">실시간 회의 채팅</h3>
        <button class="map-close-btn" style="position:static;" onclick="toggleChatModal()">✕</button>
      </div>
      <div class="chat-log" id="meeting-chat-log"></div>
      <div class="chat-input-bar">
        <input type="text" id="chat-input" placeholder="채팅 입력 (100자 이내)..." maxlength="100" onkeydown="handleChatKeyDown(event)">
        <button onclick="sendMeetingChat()">전송</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="tasks.js"></script>
<script>
const socket = io();

function segmentParam(a, b, c, d) {
  const rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y;
  const den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((c.x - a.x) * sy - (c.y - a.y) * sx) / den;
  const u = ((c.x - a.x) * ry - (c.y - a.y) * rx) / den;
  return (t > 0 && t < 1 && u >= 0 && u <= 1) ? t : null;
}
function buildWallSegments(polys) {
  const walls = [];
  for (let i = 0; i < polys.length; i++) {
    const A = polys[i];
    for (let k = 0; k < A.length; k++) {
      const a = A[k], b = A[(k + 1) % A.length];
      const cuts = [0, 1];
      for (let j = 0; j < polys.length; j++) {
        if (j === i) continue;
        const B = polys[j];
        for (let m = 0; m < B.length; m++) {
          const t = segmentParam(a, b, B[m], B[(m + 1) % B.length]);
          if (t !== null) cuts.push(t);
        }
      }
      cuts.sort((p, q) => p - q);
      for (let n = 0; n < cuts.length - 1; n++) {
        const t0 = cuts[n], t1 = cuts[n + 1];
        if (t1 - t0 < 1e-6) continue;
        const tm = (t0 + t1) / 2;
        const mid = { x: a.x + (b.x - a.x) * tm, y: a.y + (b.y - a.y) * tm };
        let covered = false;
        for (let j = 0; j < polys.length; j++) {
          if (j !== i && isPointInPolygon(mid, polys[j])) { covered = true; break; }
        }
        if (!covered) walls.push({
          p1: { x: a.x + (b.x - a.x) * t0, y: a.y + (b.y - a.y) * t0 },
          p2: { x: a.x + (b.x - a.x) * t1, y: a.y + (b.y - a.y) * t1 }
        });
      }
    }
  }
  return walls;
}
const WALL_SEGMENTS = buildWallSegments(WALKABLE_POLYS);

// ───── 충돌 ─────
const WALL_MARGIN = 24;
function isValidPosition(nx, ny, ox, oy) {
  if (!currentRoom || currentRoom.state === 'LOBBY') return (nx >= 520 && nx <= 1880 && ny >= 600 && ny <= 1700);
  const m0 = currentRoom.players[myId];
  if (m0 && !m0.isAlive && currentRoom.state === 'PLAYING') return nx > 20 && ny > 20 && nx < MAP_WIDTH - 20 && ny < MAP_HEIGHT - 20; // 유령 벽 통과
  const pt = { x: nx, y: ny };
  if (!WALKABLE_POLYS.some(poly => isPointInPolygon(pt, poly))) return false;
  for (const seg of WALL_SEGMENTS) if (distToSegment(pt, seg.p1, seg.p2) < WALL_MARGIN) return false;
  for (const o of OBST) {
    if (o.r !== undefined) { if (Math.hypot(nx - o.x, ny - o.y) < o.r + OB_M) return false; }
    else if (nx > o.x0 - OB_M && nx < o.x1 + OB_M && ny > o.y0 - OB_M && ny < o.y1 + OB_M) return false;
  }
  for (const seg of closedSegs) {  // 닫힌 문 (문에 끼었을 땐 멀어지는 방향만 허용)
    const d = distToSegment(pt, seg.p1, seg.p2);
    if (d < WALL_MARGIN && (ox === undefined || d < distToSegment({ x: ox, y: oy }, seg.p1, seg.p2))) return false;
  }
  return true;
}
function snapToValid(x, y) {
  if (isValidPosition(x, y)) return { x, y };
  for (let r = 10; r <= 400; r += 10) {
    for (let i = 0; i < 24; i++) {
      const a = (Math.PI * 2 * i) / 24;
      const nx = x + Math.cos(a) * r, ny = y + Math.sin(a) * r;
      if (isValidPosition(nx, ny)) return { x: nx, y: ny };
    }
  }
  return { x, y };
}
function distToSegment(p, v, w) {
  const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
  if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
  let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
}
function hasLineOfSight(x1, y1, x2, y2) {
  for (const seg of allSegs()) if (getLineIntersection(x1, y1, x2, y2, seg.p1.x, seg.p1.y, seg.p2.x, seg.p2.y)) return false;
  return true;
}

// ───── 그리기 ─────
function drawVent(context, v) {
  context.save();
  context.translate(v.x, v.y);
  const isOpen = (ventLids[v.id] || 0) > 0;
  const lidOffset = isOpen ? -20 : 0, lidAngle = isOpen ? -0.4 : 0;
  context.fillStyle = '#06080e'; context.strokeStyle = '#1b2631'; context.lineWidth = 4;
  context.beginPath(); context.roundRect(-36, -24, 72, 48, 6); context.fill(); context.stroke();
  context.save();
  context.translate(0, lidOffset); context.rotate(lidAngle);
  context.fillStyle = '#566573'; context.strokeStyle = '#17202a'; context.lineWidth = 5;
  context.beginPath(); context.roundRect(-36, -24, 72, 48, 6); context.fill(); context.stroke();
  context.fillStyle = '#85929e'; context.strokeStyle = '#111'; context.lineWidth = 2;
  for (let vy = -11; vy <= 11; vy += 7.5) { context.fillRect(-26, vy, 52, 3.5); context.strokeRect(-26, vy, 52, 3.5); }
  context.restore();
  context.restore();
}

function drawDoors(c) {
  closedSegs.forEach(s => {
    c.save(); c.lineCap = 'round';
    c.strokeStyle = '#7f1d1d'; c.lineWidth = 18; c.beginPath(); c.moveTo(s.p1.x, s.p1.y); c.lineTo(s.p2.x, s.p2.y); c.stroke();
    c.strokeStyle = '#ef4444'; c.lineWidth = 8; c.setLineDash([14, 10]); c.stroke();
    c.restore();
  });
}

// 미션 하는 모습 (스캔/소행성/쉴드/쓰레기)
function drawTaskFx(c, p, tick) {
  if (!p.visual || !p.isAlive) return;
  c.save(); c.translate(p.x, p.y);
  if (p.visual === 'scan') {
    c.fillStyle = 'rgba(74,222,128,.25)'; c.fillRect(-48, -70, 96, 130);
    c.fillStyle = 'rgba(134,239,172,.95)'; c.fillRect(-48, -70 + ((tick * 3) % 126), 96, 5);
  } else if (p.visual === 'asteroids') {
    c.strokeStyle = '#f87171'; c.lineWidth = 5; c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = tick * 0.12 + i * 2.1, r0 = 40 + ((tick * 7 + i * 50) % 140);
      c.beginPath(); c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); c.lineTo(Math.cos(a) * (r0 + 28), Math.sin(a) * (r0 + 28)); c.stroke();
    }
  } else if (p.visual === 'shields') {
    const r = 56 + Math.sin(tick * 0.15) * 6;
    c.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + tick * 0.02; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath();
    c.fillStyle = 'rgba(56,189,248,.2)'; c.fill(); c.strokeStyle = '#38bdf8'; c.lineWidth = 5; c.stroke();
  } else if (p.visual === 'garbage') {
    c.fillStyle = '#4ade80';
    for (let i = 0; i < 5; i++) c.fillRect(-30 + i * 15, -70 + ((tick * 4 + i * 25) % 90), 8, 18);
  }
  c.restore();
}

function drawCrewmate(context, x, y, color, name, isMe, dir, isMoving, isAlive, inVent, animState, tick) {
  if (inVent && animState <= 0) return;
  context.save();
  context.translate(x, y);
  if (!isAlive) context.globalAlpha = 0.5;
  let scaleMod = 1.15;
  if (animState > 0) scaleMod *= animState / 25;          // 들어가는 중: 작아짐
  else if (animState < 0) scaleMod *= 1 + animState / 25; // 나오는 중: 커짐
  context.scale(dir * scaleMod, scaleMod);
  const bounce = (isMoving && isAlive) ? Math.sin(tick * 0.3) * 3 : 0;

  context.fillStyle = color; context.strokeStyle = '#000'; context.lineWidth = 4;
  context.beginPath(); context.roundRect(-24, -20 + bounce, 12, 34, 6); context.fill(); context.stroke();
  context.beginPath();
  context.arc(0, -14 + bounce, 18, Math.PI, 0, false);
  context.lineTo(18, 14 + bounce); context.lineTo(6, 26 + bounce); context.lineTo(2, 14 + bounce);
  context.lineTo(-6, 26 + bounce); context.lineTo(-18, 14 + bounce);
  context.closePath(); context.fill(); context.stroke();
  context.fillStyle = '#8ce8ff';
  context.beginPath(); context.ellipse(8, -12 + bounce, 13, 8, 0, 0, Math.PI * 2); context.fill(); context.stroke();
  context.fillStyle = '#fff';
  context.beginPath(); context.ellipse(6, -14 + bounce, 6, 2.5, -0.2, 0, Math.PI * 2); context.fill();
  context.restore();

  context.save();
  context.font = '15px "Fredoka One", sans-serif';
  context.textAlign = 'center';
  context.fillStyle = isMe ? (role === 'IMPOSTOR' ? '#ef4444' : '#0284c7') : '#0f172a';
  context.strokeStyle = '#ffffff'; context.lineWidth = 4;
  context.strokeText(name, x, y - 44); context.fillText(name, x, y - 44);
  context.restore();
}

function drawDeadBody(context, x, y, color) {
  context.save();
  context.translate(x, y); context.scale(1.15, 1.15);
  context.fillStyle = color; context.strokeStyle = '#000'; context.lineWidth = 4;
  context.beginPath(); context.roundRect(-18, -4, 36, 20, 6); context.fill(); context.stroke();
  context.fillStyle = '#fff';
  context.beginPath(); context.arc(-4, -14, 5, 0, Math.PI * 2); context.arc(4, -14, 5, 0, Math.PI * 2); context.rect(-3, -12, 6, 12);
  context.fill(); context.stroke();
  context.restore();
}

function raySegmentDistance(px, py, dx, dy, seg) {
  const sx = seg.p2.x - seg.p1.x, sy = seg.p2.y - seg.p1.y;
  const den = dx * sy - dy * sx;
  if (Math.abs(den) < 1e-9) return Infinity;
  const qx = seg.p1.x - px, qy = seg.p1.y - py;
  const t = (qx * sy - qy * sx) / den;
  const u = (qx * dy - qy * dx) / den;
  return (t >= 0 && u >= -1e-9 && u <= 1 + 1e-9) ? t : Infinity;
}
function getVisibilityPolygon(px, py, radius) {
  const origin = { x: px, y: py };
  const nearby = allSegs().filter(seg => distToSegment(origin, seg.p1, seg.p2) <= radius);
  const EPS = 0.0001, angles = [];
  for (const seg of nearby) for (const p of [seg.p1, seg.p2]) {
    const a = Math.atan2(p.y - py, p.x - px);
    angles.push(a - EPS, a, a + EPS);
  }
  const BASE_RAYS = 96;
  for (let i = 0; i < BASE_RAYS; i++) angles.push(-Math.PI + (Math.PI * 2 * i) / BASE_RAYS);
  angles.sort((a, b) => a - b);
  const poly = [];
  for (const ang of angles) {
    const dx = Math.cos(ang), dy = Math.sin(ang);
    let nearest = radius;
    for (const seg of nearby) { const t = raySegmentDistance(px, py, dx, dy, seg); if (t < nearest) nearest = t; }
    poly.push({ x: px + dx * nearest, y: py + dy * nearest });
  }
  return poly;
}
function getLineIntersection(p0_x, p0_y, p1_x, p1_y, p2_x, p2_y, p3_x, p3_y) {
  const s1_x = p1_x - p0_x, s1_y = p1_y - p0_y, s2_x = p3_x - p2_x, s2_y = p3_y - p2_y;
  const s = (-s1_y * (p0_x - p2_x) + s1_x * (p0_y - p2_y)) / (-s2_x * s1_y + s1_x * s2_y);
  const t = (s2_x * (p0_y - p2_y) - s2_y * (p0_x - p2_x)) / (-s2_x * s1_y + s1_x * s2_y);
  if (s >= 0 && s <= 1 && t >= 0 && t <= 1) return { x: p0_x + (t * s1_x), y: p0_y + (t * s1_y) };
  return null;
}
function isPointInPolygon(point, vs) {
  const x = point.x, y = point.y;
  let inside = false;
  for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
    const xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function renderMinimap() {
  const mCanvas = document.getElementById('minimap-canvas');
  const mCtx = mCanvas.getContext('2d');
  mCanvas.width = mCanvas.offsetWidth; mCanvas.height = mCanvas.offsetHeight;
  const scaleX = mCanvas.width / MAP_WIDTH, scaleY = mCanvas.height / MAP_HEIGHT;
  mCtx.fillStyle = '#ffffff'; mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
  if (skeldMapImg.complete && skeldMapImg.naturalWidth > 0) {
    mCtx.imageSmoothingEnabled = false;
    mCtx.drawImage(skeldMapImg, 0, 0, MAP_WIDTH * scaleX, MAP_HEIGHT * scaleY);
  }
  mCtx.fillStyle = '#ef4444';
  mCtx.beginPath(); mCtx.arc(localPlayer.x * scaleX, localPlayer.y * scaleY, 7, 0, Math.PI * 2); mCtx.fill();
}

// e.code 기반: 한글 입력/CapsLock/Shift 상태에서도 WASD·방향키 정상 동작
const KEYMAP = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', ArrowUp: 'ArrowUp', ArrowLeft: 'ArrowLeft', ArrowDown: 'ArrowDown', ArrowRight: 'ArrowRight' };
window.addEventListener('keydown', (e) => {
  const k = KEYMAP[e.code];
  if (!k || (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))) return;
  keys[k] = true; e.preventDefault();
});
window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
function joyUpdate(t) {
  const dx = t.clientX - joystick.startX, dy = t.clientY - joystick.startY, dist = Math.hypot(dx, dy), max = 40;
  if (dist > 0) {
    joystick.dx = (dx / dist) * Math.min(dist / max, 1);
    joystick.dy = (dy / dist) * Math.min(dist / max, 1);
    joyKnob.style.transform = `translate(${joystick.dx * max}px, ${joystick.dy * max}px)`;
  }
}
function joyEnd() {
  joystick.active = false; joystick.id = null; joystick.dx = 0; joystick.dy = 0;
  joyKnob.style.transform = 'translate(0px, 0px)';
}
joyZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (joystick.active) return;
  const t = e.changedTouches[0], rc = joyZone.getBoundingClientRect();
  joystick.active = true; joystick.id = t.identifier;
  joystick.startX = rc.left + rc.width / 2; joystick.startY = rc.top + rc.height / 2;
  joyUpdate(t);
}, { passive: false });
window.addEventListener('touchmove', (e) => {
  if (!joystick.active) return;
  for (const t of e.changedTouches) if (t.identifier === joystick.id) { joyUpdate(t); break; }
});
const joyEndH = (e) => { for (const t of e.changedTouches) if (t.identifier === joystick.id) { joyEnd(); break; } };
window.addEventListener('touchend', joyEndH);
window.addEventListener('touchcancel', joyEndH);

let animTick = 0, lastTs = 0, lastSend = 0, wasMoving = false;
function gameLoop(ts) {
  const dt = Math.min(3, lastTs ? (ts - lastTs) / 16.667 : 1); // 프레임 보정 (고주사율 모니터에서도 같은 속도)
  const dms = lastTs ? ts - lastTs : 0;
  lastTs = ts;
  animTick++;
  if (isVented) lastKillStamp += dms; // 벤트 안에서는 킬 쿨다운 정지
  for (const k in ventLids) if (ventLids[k] > 0) ventLids[k]--;
  if (currentRoom) Object.values(currentRoom.players).forEach(p => { if (p.ventAnim > 0) p.ventAnim--; else if (p.ventAnim < 0) p.ventAnim++; });
  if (animTick % 15 === 0) updateSabIcons();
  if (ventAnimTick > 0) ventAnimTick--;

  let vx = 0, vy = 0;
  if (keys.w || keys.ArrowUp) vy -= 1;
  if (keys.s || keys.ArrowDown) vy += 1;
  if (keys.a || keys.ArrowLeft) vx -= 1;
  if (keys.d || keys.ArrowRight) vx += 1;
  if (joystick.active) { vx += joystick.dx; vy += joystick.dy; }

  const len = Math.hypot(vx, vy);
  let moving = false;
  if (len > 0.05 && currentRoom && (currentRoom.state === 'PLAYING' || currentRoom.state === 'LOBBY') && !isVented && !TaskSys.isOpen() && !adminOpen && !camOpen) {
    const ox = localPlayer.x, oy = localPlayer.y;
    const step = 6.4 * dt * Math.min(len, 1);
    const nextX = ox + (vx / len) * step, nextY = oy + (vy / len) * step;
    if (isValidPosition(nextX, oy, ox, oy)) localPlayer.x = nextX;
    if (isValidPosition(localPlayer.x, nextY, localPlayer.x, oy)) localPlayer.y = nextY;
    if (vx !== 0) localPlayer.dir = vx > 0 ? 1 : -1;
    moving = localPlayer.x !== ox || localPlayer.y !== oy; // 벽에 막혀 제자리면 걷는 모션 X
  }
  localPlayer.isMoving = moving;

  // 위치 전송: 이동 중엔 20Hz, 멈추는 순간엔 최종 위치 1회
  const nowMs = performance.now();
  if (currentRoom && (moving ? nowMs - lastSend >= 50 : wasMoving)) {
    socket.emit('player_move', { x: localPlayer.x, y: localPlayer.y, dir: localPlayer.dir, isMoving: moving });
    lastSend = nowMs;
  }
  wasMoving = moving;

  // 다른 플레이어 부드럽게 보간
  if (currentRoom) Object.values(currentRoom.players).forEach(p => {
    if (p.id === myId || p.tx === undefined) return;
    const k = Math.min(1, 0.3 * dt);
    p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k;
    if (Math.hypot(p.tx - p.x, p.ty - p.y) > 500) { p.x = p.tx; p.y = p.ty; }
  });

  if (currentRoom && currentRoom.state === 'PLAYING' && currentRoom.players[myId]) {
    const killBtn = document.getElementById('btn-kill');
    const sabBtn = document.getElementById('btn-sabotage');
    const useBtn = document.getElementById('btn-use');
    const ventBtn = document.getElementById('btn-vent');
    const reportBtn = document.getElementById('btn-report');
    const killOverlay = document.getElementById('kill-cooldown-num');
    const sabOv = document.getElementById('sab-cooldown-num');
    const alive = currentRoom.players[myId].isAlive;
    const nearUse = nearTable() || nearAdmin() || nearSec() || !!TaskSys.nearest();

    if (role === 'IMPOSTOR') {
      useBtn.style.display = 'none';
      sabBtn.style.display = 'block';
      if (nearUse && !isVented) {
        sabBtn.classList.add('btn-use'); sabBtn.classList.remove('btn-sabotage');
        sabBtn.classList.add('active'); sabOv.style.display = 'none';
      } else {
        sabBtn.classList.add('btn-sabotage'); sabBtn.classList.remove('btn-use');
        if (sabReady() || anyDoorReady()) { sabBtn.classList.add('active'); sabOv.style.display = 'none'; }
        else {
          sabBtn.classList.remove('active');
          const cands = Object.keys(DOOR_DEFS).filter(k => !(sabotageState.doors || []).includes(k)).map(doorRem);
          if (!sabotageState.type) cands.push(sabCdSec());
          const rem = cands.length ? Math.min(...cands) : 0;
          if (rem > 0) { sabOv.style.display = 'flex'; sabOv.innerText = rem; } else sabOv.style.display = 'none';
        }
      }

      if (alive) {
        killBtn.style.display = 'block';
        const remainSec = Math.max(0, Math.ceil(killCooldown - (Date.now() - lastKillStamp) / 1000));
        const target = getNearestAliveCrewmate();
        if (remainSec === 0 && target && !isVented) { killBtn.classList.add('active'); killOverlay.style.display = 'none'; }
        else {
          killBtn.classList.remove('active');
          if (remainSec > 0) { killOverlay.style.display = 'flex'; killOverlay.innerText = remainSec; }
          else killOverlay.style.display = 'none';
        }
        ventBtn.style.display = 'block'; // 임포스터는 벤트 버튼 항상 표시 (가까울 때만 활성)
        if (getNearestVent() || isVented) ventBtn.classList.add('active'); else ventBtn.classList.remove('active');
      } else {
        killBtn.style.display = 'none'; ventBtn.style.display = 'none';
      }
    } else {
      killBtn.style.display = 'none'; sabBtn.style.display = 'none'; ventBtn.style.display = 'none';
      useBtn.style.display = 'block';
      if (nearUse) useBtn.classList.add('active'); else useBtn.classList.remove('active');
    }

    let canReport = false;
    bodies.forEach(b => {
      if (Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y) < 180 && hasLineOfSight(localPlayer.x, localPlayer.y, b.x, b.y)) canReport = true;
    });
    if (canReport && alive && !isVented) reportBtn.classList.add('active'); else reportBtn.classList.remove('active');
  }

  if (adminOpen && currentRoom) renderAdmin();
  if (camOpen && currentRoom) renderCams();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentRoom) {
    const camX = canvas.width / 2 - localPlayer.x;
    const camY = canvas.height / 2 - localPlayer.y;
    ctx.save();
    ctx.translate(camX, camY);

    if (currentRoom.state === 'LOBBY') {
      if (waitShipImg.complete && waitShipImg.naturalWidth > 0) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(waitShipImg, 0, 0, LOBBY_RENDER_W, LOBBY_RENDER_H);
      } else { ctx.fillStyle = '#222f3e'; ctx.fillRect(0, 0, LOBBY_RENDER_W, LOBBY_RENDER_H); }
      Object.values(currentRoom.players).forEach(p => {
        if (p.id !== myId) drawCrewmate(ctx, p.x, p.y, p.color, p.name, false, p.dir || 1, p.isMoving, p.isAlive, p.inVent, 0, animTick);
      });
    } else {
      if (skeldMapImg.complete && skeldMapImg.naturalWidth > 0) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(skeldMapImg, 0, 0, MAP_WIDTH, MAP_HEIGHT);
      } else { ctx.fillStyle = '#1e2837'; ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT); }

      REAL_SKELD_VENTS.forEach(v => drawVent(ctx, v));
      drawDoors(ctx);
      drawCamLights(ctx);
      TaskSys.draw(ctx, animTick);

      const me = currentRoom.players[myId];
      const meDead = !!me && !me.isAlive;
      const visionRadius = (role === 'IMPOSTOR' || meDead) ? 2000 : (sabotageState.type === 'lights' ? 400 : 800);
      const visiblePolygon = getVisibilityPolygon(localPlayer.x, localPlayer.y, visionRadius);

      bodies.forEach(b => {
        if (role === 'IMPOSTOR' || meDead || (Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y) <= visionRadius && isPointInPolygon(b, visiblePolygon))) drawDeadBody(ctx, b.x, b.y, b.color);
      });

      Object.values(currentRoom.players).forEach(p => {
        if (p.id === myId) return;
        if (!!p.isAlive === meDead) return; // 유령은 유령끼리만, 산 사람은 산 사람끼리만
        const inDist = Math.hypot(p.x - localPlayer.x, p.y - localPlayer.y) <= visionRadius;
        const isVisible = role === 'IMPOSTOR' || meDead || (inDist && isPointInPolygon(p, visiblePolygon));
        if (isVisible) {
          drawTaskFx(ctx, p, animTick);
          drawCrewmate(ctx, p.x, p.y, p.color, p.name, false, p.dir || 1, p.isMoving, p.isAlive, p.inVent, p.ventAnim || 0, animTick);
        }
      });

      // 안개
      mctx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      mctx.save();
      mctx.globalCompositeOperation = 'source-over';
      mctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
      mctx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
      mctx.globalCompositeOperation = 'destination-out';
      const scrX = localPlayer.x + camX, scrY = localPlayer.y + camY;
      const fade = mctx.createRadialGradient(scrX, scrY, visionRadius * 0.85, scrX, scrY, visionRadius);
      fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
      mctx.fillStyle = fade;
      mctx.beginPath();
      mctx.moveTo(visiblePolygon[0].x + camX, visiblePolygon[0].y + camY);
      for (let i = 1; i < visiblePolygon.length; i++) mctx.lineTo(visiblePolygon[i].x + camX, visiblePolygon[i].y + camY);
      mctx.closePath(); mctx.fill();
      mctx.restore();
    }

    const me = currentRoom.players[myId];
    if (me) {
      if (currentRoom.state !== 'LOBBY') drawTaskFx(ctx, me, animTick);
      drawCrewmate(ctx, localPlayer.x, localPlayer.y, me.color, me.name, true, localPlayer.dir, localPlayer.isMoving, me.isAlive, isVented, ventAnimTick * ventAnimDir, animTick);
    }
    ctx.restore();

    if (currentRoom.state === 'PLAYING') {
      const m0 = currentRoom.players[myId];
      if (!(m0 && !m0.isAlive)) ctx.drawImage(maskCanvas, 0, 0); // 유령은 안개 없음
      ctx.save(); ctx.translate(camX, camY);                       // 열리는 벤트는 어두운 곳/벽 너머에서도 보이게
      REAL_SKELD_VENTS.forEach(v => { if ((ventLids[v.id] || 0) > 0) drawVent(ctx, v); });
      ctx.restore();
      drawSabArrows();
    }
  }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
